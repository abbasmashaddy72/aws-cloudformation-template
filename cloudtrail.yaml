AWSTemplateFormatVersion: "2010-09-09"
Description: "Deploys a global CloudTrail with optional alarms for monitoring security events and logging to an internal or external S3 bucket."

# Metadata for grouping parameters in the AWS Management Console for easier readability
Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: "CloudTrail Parameters"
        Parameters:
          - ParentAlertStack
          - CloudWatchLogsRetentionInDays
          - ExternalTrailBucket
          - LogFilePrefix
          - S3DataEvents
      - Label:
          default: "Permission Parameters"
        Parameters:
          - PermissionsBoundary

# Parameter section defines inputs for the CloudFormation stack
Parameters:
  ParentAlertStack:
    Description: "Optional stack name of parent alert stack based on operations/alert.yaml template."
    Type: String
    Default: ""
  PermissionsBoundary:
    Description: "Optional ARN for a permission boundary policy applied to all roles created by this template."
    Type: String
    Default: ""
  CloudWatchLogsRetentionInDays:
    Description: "The number of days log events are retained in CloudWatch Logs."
    Type: Number
    Default: 14
    AllowedValues:
      [
        1,
        3,
        5,
        7,
        14,
        30,
        60,
        90,
        120,
        150,
        180,
        365,
        400,
        545,
        731,
        1827,
        3653,
      ]
  ExternalTrailBucket:
    Description: "Optional: External S3 bucket name where CloudTrail logs will be stored. If empty, an internal bucket is created."
    Type: String
    Default: ""
  LogFilePrefix:
    Description: "Optional: Prefix for log file names."
    Type: String
    Default: ""
  S3DataEvents:
    Description: "Record data events for all S3 buckets. Additional charges may apply."
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  S3EncryptionType:
    Description: "Choose the S3 encryption type for CloudTrail logs."
    Type: String
    Default: "SSE-S3"
    AllowedValues: ["SSE-S3", "SSE-KMS"]
  KMSKeyId:
    Description: "Provide the KMS key ID if SSE-KMS is selected for S3 encryption."
    Type: String
    Default: ""
  Environment:
    Description: "Select the environment (prod, dev, or test)."
    Type: String
    Default: "prod"
    AllowedValues: ["prod", "dev", "test"]
  AlarmThreshold:
    Description: "Set the threshold for CloudWatch alarms."
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 5, 10]
  EnableInsights:
    Description: "Enable CloudTrail Insights (recommended for production)."
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

# Conditions define whether to create or configure specific resources
Conditions:
  HasAlertTopic: !Not [!Equals [!Ref ParentAlertStack, ""]]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundary, ""]]
  ExternalBucket: !Not [!Equals [!Ref ExternalTrailBucket, ""]]
  InternalBucket: !Equals [!Ref ExternalTrailBucket, ""]
  HasLogFilePrefix: !Not [!Equals [!Ref LogFilePrefix, ""]]
  IsS3DataEvents: !Equals [!Ref S3DataEvents, "true"]
  UseSSEKMS: !Equals [!Ref S3EncryptionType, "SSE-KMS"]
  IsProduction: !Equals [!Ref Environment, "prod"]
  IsInsightsEnabled: !Equals [!Ref EnableInsights, "true"]

Resources:
  # Fallback SNS topic
  FallbackSNSTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      TopicName: "FallbackAlarms"

  # KMS key for S3 encryption
  TrailKMSKey:
    Type: "AWS::KMS::Key"
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:GenerateDataKey*"

  # S3 bucket for Access Logging
  AccessLoggingBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub "${AWS::AccountId}-trail-bucket-access-logs"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Creates an internal S3 bucket if an external one is not provided
  TrailBucket:
    Condition: InternalBucket
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Sub "${AWS::AccountId}-cloudtrail-logs-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - !If
            - UseSSEKMS
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !Ref KMSKeyId
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: "LogRetention"
            Status: "Enabled"
            ExpirationInDays: 365
            NoncurrentVersionExpirationInDays: 30
      LoggingConfiguration:
        DestinationBucketName: !Sub "${AWS::AccountId}-trail-bucket-access-logs"
        LogFilePrefix: "access-logs/"

  # S3 bucket policy for CloudTrail logging
  TrailBucketPolicy:
    Condition: InternalBucket
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: "s3:GetBucketAcl"
            Resource: !Sub "arn:aws:s3:::${TrailBucket}"
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: "s3:PutObject"
            Resource: !If
              - HasLogFilePrefix
              - !Sub "arn:aws:s3:::${TrailBucket}/${LogFilePrefix}/AWSLogs/${AWS::AccountId}/*"
              - !Sub "arn:aws:s3:::${TrailBucket}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": "bucket-owner-full-control"
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt "TrailBucket.Arn"
              - !Sub "${TrailBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  # CloudWatch log group for CloudTrail logs
  TrailLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: "/aws/cloudtrail/logs"
      RetentionInDays: !If
        - IsProduction
        - 365
        - 30

  # IAM Role allowing CloudTrail to log to CloudWatch
  TrailLogGroupRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Action: "sts:AssumeRole"
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref "AWS::NoValue"
      Policies:
        - PolicyName: "cloudtrail-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: !GetAtt "TrailLogGroup.Arn"

  # SNS topic for CloudTrail notifications (optional)
  TrailTopic:
    Type: "AWS::SNS::Topic"
    Properties: {}

  # SNS topic policy for CloudTrail
  TrailTopicPolicy:
    Type: "AWS::SNS::TopicPolicy"
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailSNSPolicy
            Effect: Allow
            Principal:
              Service: "cloudtrail.amazonaws.com"
            Resource: !Ref TrailTopic
            Action: "sns:Publish"
      Topics:
        - !Ref TrailTopic

  # SNS topic for Config Compliance notifications (optional)
  ConfigComplianceSNSTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      TopicName: "ConfigComplianceNotifications"

  # SNS topic policy for ConfigRule
  ConfigRuleSNSTopicPolicy:
    Type: "AWS::SNS::TopicPolicy"
    Properties:
      Topics:
        - !Ref ConfigComplianceSNSTopic
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: "sns:Publish"
            Principal: "*"
            Resource: !Ref ConfigComplianceSNSTopic

  # Main CloudTrail resource for logging to S3, CloudWatch, and SNS
  Trail:
    Condition: InternalBucket
    DependsOn:
      - TrailBucketPolicy
      - TrailTopicPolicy
    Type: "AWS::CloudTrail::Trail"
    Properties:
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: true
      EventSelectors:
        - DataResources:
            - Type: "AWS::S3::Object"
              Values:
                - "arn:aws:s3:::"
            - Type: "AWS::Lambda::Function"
              Values:
                - "arn:aws:lambda:::"
            - Type: "AWS::DynamoDB::Table"
              Values:
                - "arn:aws:dynamodb:::"
            - Type: "AWS::RDS::DBInstance"
              Values:
                - "arn:aws:rds:::"
            - Type: "AWS::Kinesis::Stream"
              Values:
                - "arn:aws:kinesis:::"
        - IncludeManagementEvents: true
          ReadWriteType: All
      S3BucketName: !Ref TrailBucket
      S3KeyPrefix: !Ref LogFilePrefix
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !GetAtt "TrailLogGroup.Arn"
      CloudWatchLogsRoleArn: !GetAtt "TrailLogGroupRole.Arn"
      SnsTopicName: !GetAtt "TrailTopic.TopicName"

  # CloudTrail Insights for detecting unusual activity
  TrailInsights:
    Condition: IsInsightsEnabled
    Type: "AWS::CloudTrail::Trail"
    Properties:
      InsightSelectors:
        - InsightType: "ApiCallRateInsight"
        - InsightType: "ApiErrorRateInsight"
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      IsLogging: true
      S3BucketName: !Ref TrailBucket
      S3KeyPrefix: !Ref LogFilePrefix
      CloudWatchLogsLogGroupArn: !GetAtt TrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt TrailLogGroupRole.Arn
      EnableLogFileValidation: true

  # Multi-account CloudTrail setup for AWS Organizations
  OrgTrail:
    Condition: ExternalBucket
    Type: "AWS::CloudTrail::Trail"
    Properties:
      IsOrganizationTrail: true
      IsLogging: true
      S3BucketName: !Ref ExternalTrailBucket
      S3KeyPrefix: !Ref LogFilePrefix
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !GetAtt "TrailLogGroup.Arn"
      CloudWatchLogsRoleArn: !GetAtt "TrailLogGroupRole.Arn"
      SnsTopicName: !GetAtt "TrailTopic.TopicName"

  # Compliance reporting using AWS Config Rules
  ConfigRuleTrailEnabled:
    Type: "AWS::Config::ConfigRule"
    Properties:
      ConfigRuleName: "cloudtrail-enabled"
      Scope:
        ComplianceResourceTypes:
          - "AWS::CloudTrail::Trail"
      Source:
        Owner: "AWS"
        SourceIdentifier: "CLOUD_TRAIL_ENABLED"

  # External CloudTrail resource if an external bucket is provided
  ExternalTrail:
    Condition: ExternalBucket
    DependsOn:
      - TrailTopicPolicy
    Type: "AWS::CloudTrail::Trail"
    Properties:
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: true
      EventSelectors:
        - !If
          - IsS3DataEvents
          - - DataResources:
                - Type: "AWS::S3::Object"
                  Values:
                    - "arn:aws:s3:::"
              IncludeManagementEvents: true
              ReadWriteType: All
          - - DataResources:
                - Type: "AWS::S3::Object"
                  Values:
                    - "arn:aws:s3:::"
                - Type: "AWS::RDS::DBInstance"
                  Values:
                    - "arn:aws:rds:::"
                - Type: "AWS::Kinesis::Stream"
                  Values:
                    - "arn:aws:kinesis:::"
      S3BucketName: !Ref ExternalTrailBucket
      S3KeyPrefix: !Ref LogFilePrefix
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !GetAtt "TrailLogGroup.Arn"
      CloudWatchLogsRoleArn: !GetAtt "TrailLogGroupRole.Arn"
      SnsTopicName: !GetAtt "TrailTopic.TopicName"

  # Unauthorized API Operation Metric Filter
  UnauthorizedOperationMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: '{($.errorCode = "*UnauthorizedOperation") || ($.errorCode = "AccessDenied*")}'
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "UnauthorizedOperationCount"

  # Unauthorized API Operation Alarm
  UnauthorizedOperationAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: unauthorized API calls detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: UnauthorizedOperationCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: !Ref AlarmThreshold
      AlarmActions:
        - !If
          - HasAlertTopic
          - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
          - !Ref FallbackSNSTopic
      TreatMissingData: notBreaching

  # Non-MFA Console Login Metric Filter (CIS 3.2)
  NonMfaConsoleLoginMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: '{($.eventName = "ConsoleLogin") && ($.additionalEventData.MFAUsed != "Yes")}'
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "NonMfaConsoleLoginCount"

  # Non-MFA Console Login Alarm
  NonMfaConsoleLoginAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: Management Console sign-in without MFA detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: NonMfaConsoleLoginCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # Root User Activity Metric Filter (CIS 1.1 & 3.3)
  RootUserActivityMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: '{$.userIdentity.type = "Root" && $.userIdentity.invokedBy NOT EXISTS && $.eventType != "AwsServiceEvent"}'
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "RootUserActivityCount"

  # Root User Activity Alarm
  RootUserActivityAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: usage of root account/user detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: RootUserActivityCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # IAM Policy Change Metric Filter (CIS 3.4)
  IamPolicyChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventName=DeleteGroupPolicy) || ($.eventName=DeleteRolePolicy) || ($.eventName=DeleteUserPolicy) || ($.eventName=PutGroupPolicy) || ($.eventName=PutRolePolicy) || ($.eventName=PutUserPolicy) || ($.eventName=CreatePolicy) || ($.eventName=DeletePolicy) || ($.eventName=CreatePolicyVersion) || ($.eventName=DeletePolicyVersion) || ($.eventName=AttachRolePolicy) || ($.eventName=DetachRolePolicy) || ($.eventName=AttachUserPolicy) || ($.eventName=DetachUserPolicy) || ($.eventName=AttachGroupPolicy) || ($.eventName=DetachGroupPolicy)}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "IamPolicyChangeCount"

  # IAM Policy Change Alarm
  IamPolicyChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: IAM policy changes detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: IamPolicyChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # CloudFormation Config Change Metric Filter (CIS 3.5)
  CloudFormationChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: '{($.eventSource = cloudformation.amazonaws.com) && ($.eventName = "UpdateStack")}'
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "CloudFormationStackChangeCount"

  # CloudFormation Config Change Alarm
  CloudFormationChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: CloudFormation stack changes detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: CloudFormationStackChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # CloudTrail Config Change Metric Filter (CIS 3.5)
  CloudTrailConfigChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventName = CreateTrail) || ($.eventName = UpdateTrail) || ($.eventName = DeleteTrail) || ($.eventName = StartLogging) || ($.eventName = StopLogging)}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "CloudTrailConfigChangeCount"

  # CloudTrail Config Change Alarm
  CloudTrailConfigChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: CloudTrail configuration changes detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: CloudTrailConfigChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # Management Console Auth Failure (CIS 3.6)
  ManagementConsoleAuthFailureMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: '{($.eventName = ConsoleLogin) && ($.errorMessage = "Failed authentication")}'
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "ManagementConsoleAuthFailureCount"

  ManagementConsoleAuthFailureAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: Management Console authentication failures detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: ManagementConsoleAuthFailureCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # KMS Key Deletion Metric Filter (CIS 3.7)
  DeletingKmsCmkMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventSource = kms.amazonaws.com) && (($.eventName=DisableKey) || ($.eventName=ScheduleKeyDeletion))}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "DeletingKmsCmkCount"

  # KMS Key Deletion Alarm
  DeletingKmsCmkAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: disabling or scheduled deletion of customer created CMKs detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: DeletingKmsCmkCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # S3 Bucket Policy Change Metric Filter (CIS 3.8)
  S3BucketPolicyChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventSource = s3.amazonaws.com) && (($.eventName = PutBucketAcl) || ($.eventName = PutBucketPolicy) || ($.eventName = PutBucketCors) || ($.eventName = PutBucketLifecycle) || ($.eventName = PutBucketReplication) || ($.eventName = DeleteBucketPolicy) || ($.eventName = DeleteBucketCors) || ($.eventName = DeleteBucketLifecycle) || ($.eventName = DeleteBucketReplication))}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "S3BucketPolicyChangeCount"

  # S3 Bucket Policy Change Alarm
  S3BucketPolicyChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: S3 bucket policy changes detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: S3BucketPolicyChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # AWS Config Changes Metric Filter (CIS 3.9)
  ConfigChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventSource = config.amazonaws.com) && (($.eventName = StopConfigurationRecorder) || ($.eventName = DeleteDeliveryChannel) || ($.eventName = PutDeliveryChannel) || ($.eventName = PutConfigurationRecorder))}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "ConfigChangeCount"

  # AWS Config Change Alarm
  ConfigChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: AWS Config configuration changes detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: ConfigChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # Security Group Change (CIS 3.10)
  SecurityGroupChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventName = AuthorizeSecurityGroupIngress) || ($.eventName = AuthorizeSecurityGroupEgress) || ($.eventName = RevokeSecurityGroupIngress) || ($.eventName = RevokeSecurityGroupEgress) || ($.eventName = CreateSecurityGroup) || ($.eventName = DeleteSecurityGroup)}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "SecurityGroupChangeCount"

  SecurityGroupChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: security group changes detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: SecurityGroupChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # NACL Change (CIS 3.11)
  NaclChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventName = CreateNetworkAcl) || ($.eventName = CreateNetworkAclEntry) || ($.eventName = DeleteNetworkAcl) || ($.eventName = DeleteNetworkAclEntry) || ($.eventName = ReplaceNetworkAclEntry) || ($.eventName = ReplaceNetworkAclAssociation)}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "NaclChangeCount"

  NaclChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: changes to Network Access Control List (NACL) detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: NaclChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # Network Gateway Change (CIS 3.12)
  NetworkGatewayChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventName = CreateCustomerGateway) || ($.eventName = DeleteCustomerGateway) || ($.eventName = AttachInternetGateway) || ($.eventName = CreateInternetGateway) || ($.eventName = DeleteInternetGateway) || ($.eventName = DetachInternetGateway)}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "NetworkGatewayChangeCount"

  NetworkGatewayChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: changes to network gateways detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: NetworkGatewayChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # Route Table Change (CIS 3.13)
  RouteTableChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventName = CreateRoute) || ($.eventName = CreateRouteTable) || ($.eventName = ReplaceRoute) || ($.eventName = ReplaceRouteTableAssociation) || ($.eventName = DeleteRouteTable) || ($.eventName = DeleteRoute) || ($.eventName = DisassociateRouteTable)}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "RouteTableChangeCount"

  RouteTableChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: changes to route tables detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: RouteTableChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

  # VPC Change (CIS 3.14)
  VpcChangeMetricFilter:
    Condition: HasAlertTopic
    Type: "AWS::Logs::MetricFilter"
    Properties:
      FilterPattern: "{($.eventName = CreateVpc) || ($.eventName = DeleteVpc) || ($.eventName = ModifyVpcAttribute) || ($.eventName = AcceptVpcPeeringConnection) || ($.eventName = CreateVpcPeeringConnection) || ($.eventName = DeleteVpcPeeringConnection) || ($.eventName = RejectVpcPeeringConnection) || ($.eventName = AttachClassicLinkVpc) || ($.eventName = DetachClassicLinkVpc) || ($.eventName = DisableVpcClassicLink) || ($.eventName = EnableVpcClassicLink)}"
      LogGroupName: !Ref TrailLogGroup
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: !Ref "AWS::StackName"
          MetricName: "VpcChangeCount"

  VpcChangeAlarm:
    Condition: HasAlertTopic
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "CloudTrail: changes to VPCs detected"
      Namespace: !Ref "AWS::StackName"
      MetricName: VpcChangeCount
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      AlarmActions:
        - { "Fn::ImportValue": !Sub "${ParentAlertStack}-TopicARN" }
      TreatMissingData: notBreaching

Outputs:
  TemplateID:
    Description: "CloudTrail Security Logging Template."
    Value: "security/cloudtrail"

  TemplateVersion:
    Description: "Version of this CloudTrail template."
    Value: "1.0.0"

  StackName:
    Description: "The CloudFormation stack name."
    Value: !Sub "${AWS::StackName}"
